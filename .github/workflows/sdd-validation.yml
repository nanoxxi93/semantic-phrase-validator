name: SDD Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'specs/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'specs/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'

jobs:
  validate-specs:
    name: Validate SDD Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Specs Structure
        run: python scripts/validate_sdd.py

      - name: Check constitution compliance
        run: python scripts/check_constitution.py